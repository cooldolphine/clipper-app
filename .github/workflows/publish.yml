name: Publish scheduled clips

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes
  workflow_dispatch:

permissions:
  contents: write   # lets the job save status.json

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Upload due clips
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          CLIPPER_READ_TOKEN: ${{ secrets.CLIPPER_READ_TOKEN }}
        run: python -u publish.py
      - name: Update performance numbers
        if: always()
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python -u stats.py
